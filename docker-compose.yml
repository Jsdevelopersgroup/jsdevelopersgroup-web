name: jsdevelopersgroup

services:
  # ==========================================
  # 1. DATABASE SERVICE (PostgreSQL)
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: jsc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strongpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - backend-net
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M

  # ==========================================
  # 2. MIDDLE API SERVICE (Sole DB Access)
  # ==========================================
  api-service:
    build:
      context: ./api-service
      dockerfile: Dockerfile
    container_name: jsc-api
    restart: unless-stopped
    environment:
      PORT: 4000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-appdb}
      PGUSER: ${POSTGRES_USER:-appuser}
      PGPASSWORD: ${POSTGRES_PASSWORD:-strongpassword}
      JWT_SECRET: ${JWT_SECRET:-Cjh87caj8^7&%HAS}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-admin-secret-key-jsdevelopers}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-admin123}
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
    volumes:
      - ./shared-uploads:/app/uploads
    networks:
      - backend-net
      - frontend-net
    ports:
      - "${API_HOST_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 192M

  # ==========================================
  # 3. MAIN PUBLIC WEBSITE (EJS + Vanilla JS)
  # ==========================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: jsc-web
    restart: unless-stopped
    environment:
      PORT: 3000
      API_BASE_URL: http://api-service:4000
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
    volumes:
      - ./shared-uploads:/app/uploads:ro
    networks:
      - frontend-net
    ports:
      - "${WEB_HOST_PORT:-8080}:3000"
    depends_on:
      api-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 192M

  # ==========================================
  # 4. ISOLATED ADMIN PANEL (EJS + Vanilla JS)
  # ==========================================
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: jsc-admin
    restart: unless-stopped
    environment:
      PORT: 3000
      API_BASE_URL: http://api-service:4000
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-admin-secret-key-jsdevelopers}
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
    volumes:
      - ./shared-uploads:/app/uploads:ro
    networks:
      - frontend-net
    ports:
      - "${ADMIN_HOST_PORT:-8090}:3000"
    depends_on:
      api-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 192M

volumes:
  postgres_data:

networks:
  backend-net:
    internal: true
  frontend-net:
    driver: bridge
